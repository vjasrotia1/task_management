


apiVersion: apps/v1
kind: Deployment

metadata:
  name: task-mgmt-api
  namespace: task-mgmt

spec:
  replicas: 1

  selector:
    matchLabels:
      app: task-mgmt-api

  template:
    metadata:
      labels:
        app: task-mgmt-api

    spec:
      containers:
        - name: task-mgmt-api
          image: task-mgmt-api:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: task-mgmt-config

            - secretRef:
                name: task-mgmt-secret
                #Let's configure basic CPU and memory allocation.
                #Setting	Meaning
                  #CPU request 250m	--> Kubernetes reserves 0.25 CPU core for scheduling
                  #Memory request 512Mi	--> Kubernetes uses this when deciding whether the node has enough memory
                #CPU limit 1000--> Container can use up to 1 CPU core
                #Memory limit 1Gi--> Container is limited to 1 GiB of memory

                #configure basic CPU and memory allocation. validate the deployment(dry run validation), resource config apply, then verify the rollout, verifty resource allocation(kubectl get pods)
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"


          startupProbe:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 30

          livenessProbe:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3

          readinessProbe:
                  tcpSocket:
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 3
              #Maintain the indentation exactly as shown. These three probes must be inside the container definition, at the same indentation level as image, ports, and envFrom.






  #Configuration	Meaning
#replicas: 1	Run one application instance
#image	Use the Docker image we built
#imagePullPolicy: Never	Use the local image; don't download it
#containerPort: 8080	Spring Boot listens on port 8080
#configMapRef	Load non-sensitive environment variables
#secretRef	Load passwords and JWT secret


#Important: This Deployment references your existing ConfigMap and Secret. It does not start MySQL or Redis; those remain in their existing Docker containers.
#Verify database name and username, "grep -E '^(MYSQL_DATABASE|MYSQL_USER)=' .env"
#Both values should match our ConfigMap exactly.

