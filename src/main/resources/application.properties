#when spring starts, it reads these configurations
spring.application.name=task-mgmt-api
# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_mgmt_api_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# keep real credentials out of Git
# update the file by setting up the Environment variables,
#${DB_PASSWORD} means Spring reads the password from an environment variable.
# It no longer needs to be written directly into the properties file.
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# JWT
# where secret is a base-64 encoded string
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

#Redis hostname depends on where Spring Boot is running, not whether Redis is running in Docker
# redis is exposed on mac port 6379. and springboot (intellij) runs on MAC
#Spring Boot connects to Redis through your Mac's exposed port.

#if springboot runs inside Docker- we would have used "spring.data.redis.host=redis".
# Because Docker Compose provides DNS-based service discovery.
# The Spring Boot container can reach Redis using its service name, redis.
#Inside the Spring Boot container, localhost means the Spring Boot container itself, not the Redis container and not your Mac.

#my current architecture
#Spring Boot: running directly through IntelliJ on your Mac.
#MySQL: running inside Docker, exposed on port 3307.
#Your Mac's existing MySQL: running on port 3306.
#Docker MySQL container-->Running on localhost:3307 ? MySql container port 3306
#springboot(intellij) connects to Docker mysql thru localhost:3307
#Spring Boot Docker container: stopped.

#if we move springboot into docker, in Intellij(redis hostname is localhost) and in Docker(redis hostname is redis)
#If we hardcode localhost, we would have to change the configuration. better to use envt variables with default values


spring.data.redis.host=${REDIS_HOST:localhost}
#it means, If the REDIS_HOST environment variable exists, use its value, otherwise use localhost
#later,when we run springBoot inside Docker, in docker-compose.yml we will configure:
#environment:
#  REDIS_HOST: redis
#  REDIS_PORT: 6379
#Docker will pass these values to Spring Boot, which will connect to the Redis container using its service name.
#This gives us one application configuration that works in both environments without manually editing application.propertiester
spring.data.redis.port=${REDIS_PORT:6379}


