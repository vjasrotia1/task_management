#when spring starts, it reads these configurations
spring.application.name=task-mgmt-api
# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_mgmt_api_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# keep real credentials out of Git
# update the file by setting up the Environment variables,
#${DB_PASSWORD} means Spring reads the password from an environment variable.
# It no longer needs to be written directly into the properties file.
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# JWT
# where secret is a base-64 encoded string
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
