#We'll create taskapp_user during the next planned RDS restart, so we don't incur database compute charges just for this one improvement
#MySQL least-privilege account
#Our plan is:
#1. Restart task-mgmt-mysql when we're ready.
#2. Connect to MySQL using the existing master account taskadmin.
#3. Create a separate application account called taskapp_user.
#4. Grant access only to task_mgmt_api_db.
#5. Update the DB_USERNAME and DB_PASSWORD values in AWS Secrets Manager.
#6. Test the application connection.
#7. Stop RDS again if we're not actively using the deployment.
#The application account will need these permissions:
#Permission	Purpose
#SELECT	Read tasks and users
#INSERT	Register users and create tasks
#UPDATE	Update tasks and user information
#DELETE	Delete tasks
#
#We'll assess whether schema-management permissions are needed separately. We should not grant global database administration privileges.

