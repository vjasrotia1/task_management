spring.datasource.url=jdbc:mysql://127.0.0.1:3306/task_mgmt_lock_test_db
#Why? On macOS, localhost can resolve to IPv6 (::1), whereas our successful connection test explicitly used IPv4 (127.0.0.1).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${MYSQL_TEST_PASSWORD}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

JWT_SECRET=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
JWT_EXPIRATION=3600000
#Replace your_existing_test_jwt_secret with the existing test secret from application-test.properties. Don't use your production JWT secret.
spring.data.redis.repositories.enabled=false

#Why a separate profile?
#Profile	Database
#test	H2 in-memory
#mysql-test	Local MySQL 9.5.0
#Normal application	Existing MySQL configuration
#
#create-drop means Hibernate creates the required tables when the test starts and drops them when the test context closes. It will only affect the dedicated test database.
