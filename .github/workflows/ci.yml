#What this workflow does:
#- on: Defines when the workflow runs.
#- checkout: Downloads your GitHub repository into the runner.
#- setup-java: Installs Java 17.
#- cache: maven: Caches Maven dependencies to speed up future builds.
#- mvn clean test: Compiles your code and runs your tests.

#CI success means "github actions pipeline is now passing or in other words - our project now automatically builds and runs tests when we push changes to Github or open a pull request
#CI is complete, but automated deployment (CD) is not yet configured.
#next, phase 5: will be kubernetes(k8s)
#Our goal is eventually to move Spring Boot into a Kubernetes Pod. currently Springboot is running on IntelliJ · localhost:8080 and mysql and Redis are running in Docker container
#Kubernetes
#Cluster running
#Docker Desktop · Not yet hosting your application

#The target architecture will be:
#- Spring Boot → Kubernetes Pod
#- MySQL → Kubernetes Pod (initially, for learning)
#- Redis → Kubernetes Pod
#- Kubernetes Services → internal communication between these components.

#set default namespace in k8s as task-mgmt to avoid typing -n task-mgmt with every k8s command.
#verify it using "kubectl config view --minify | grep namespace"

#current setup
#Component	Where it runs	Status
#Spring Boot API	IntelliJ on Mac	    Running separately
#MySQL 8.4	Docker container	        Healthy
#Redis 7	Docker container	        Healthy
#Welcome to Docker	Docker container	Running
#Kubernetes	        Docker Desktop	            Running

#it is recommended that we reuse our existing MySQL and Redis containers initially, rather than immediately creating new database containers inside Kubernetes.
#Why?
#- Your existing MySQL may contain task-management data that we should preserve.
#- Running duplicate MySQL and Redis instances consumes additional memory.
#- We can first learn Kubernetes Deployments, Pods, Services, ConfigMaps and Secrets with your existing infrastructure.

#Our initial target will be:
#- Spring Boot API → Kubernetes Pod.
#- MySQL → existing Docker container, accessed from Kubernetes.
#- Redis → existing Docker container, accessed from Kubernetes., Later, we can migrate MySQL and Redis into Kubernetes if needed.
#Now we'll build a Docker image that Kubernetes can use to create your Spring Boot application Pod.
name: Task Management API CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean test

#Understand the workflow
#Configuration	Purpose
#push	        Runs CI whenever you push code
#pull_request	Runs CI when a pull request is created or updated
#ubuntu-latest	GitHub provides a Linux machine
#setup-java@v4	Installs Java 17
#mvn clean test	Compiles the application and runs test

#File	Purpose
  #.github/workflows/ci.yml	       GitHub Actions CI
  #pom.xml	                       H2 test dependency
  #RedisTaskCacheServiceImpl.java	Redis caching
  #TaskServiceImpl.java	           Cache integration and task operations
  #CacheConfig.java	                Redis cache configuration
  #application.properties	       Main application configuration
  #TaskServiceImplTest.java	        Updated unit tests
  #TaskMgmtApiApplicationTests.java	Test profile activation
  #application-test.properties	    H2 and test JWT configuration
